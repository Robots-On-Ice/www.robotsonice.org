# Site Build Settings

# jekyll-paginate configuration
paginate:            20

# Build settings
markdown:            kramdown
highlighter:         rouge
permalink:           none
plugins:             [jekyll-paginate, jekyll-sitemap, jekyll-feed, jekyll-seo-tag]

sass:
  sass_dir: assets/css
  style: :nested

# Customise atom feed settings (this is where Jekyll-Feed gets configuration information)
title:		           "Robots On Ice"
description:	       "A home for Robots on Ice"
author:              "Silicon Valley Ice Skating Association"
ticket_link:         "https://www.eventbrite.com/e/robots-on-ice-2026-tickets-1984681716440?aff=oddtdtcreator&keep_tld=true"

collections:
  archive_2021:
    output: true
  archive_2023:
    output: true
  archive_2024:
    output: true
  archive_2026:
    output: true
# RSS 2.0 can be used instead of Atom by uncommenting following two lines
#feed:
#  path: rss-feed.xml
